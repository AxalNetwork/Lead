name: Reject root wrangler.toml

# Standalone guard (Task #73): apps/worker/wrangler.toml is the single
# source of truth for every Worker binding. A stray root wrangler.toml
# previously caused a manual `wrangler deploy` from the repo root to
# silently ship a Worker missing UPLOADS / AI / Vectorize / Workflow
# bindings. This job runs on every push and PR — independently of the
# deploy-worker path filter — so the offending file can never sneak
# back in unnoticed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject root wrangler.toml
        run: |
          if [ ! -e wrangler.toml ]; then
            echo "OK: no root wrangler.toml."
            exit 0
          fi
          # Allowlist: the CF Workers Builds shim (deploys a no-op Worker
          # under name 'aidatasignal-cf-builds-shim' so CF's hosted Builds
          # pipeline doesn't fall back to framework auto-detection on the
          # repo root). The real `lead` Worker config still lives at
          # apps/worker/wrangler.toml and is deployed by GitHub Actions.
          if grep -q '^name = "aidatasignal-cf-builds-shim"' wrangler.toml \
             && grep -q '^main = "cf-builds-shim.js"' wrangler.toml; then
            echo "OK: root wrangler.toml is the allowlisted CF Builds shim."
            exit 0
          fi
          echo "::error::Root wrangler.toml exists and is not the allowlisted CF Builds shim. apps/worker/wrangler.toml is the single source of truth — see apps/worker/README.md → 'Adding a new binding'." >&2
          exit 1
