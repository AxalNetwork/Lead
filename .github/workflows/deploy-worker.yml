name: Deploy Cloudflare Worker (lead)

# Auto-deploy the lead Worker on every push to main. This replaces the
# Cloudflare-hosted "Workers Build" pipeline, which kept failing because the
# repo is a monorepo and Cloudflare's auto-detect ran `npx wrangler deploy`
# from the repo root with no install of worker deps.

on:
  push:
    branches: [main]
    paths:
      - "apps/worker/**"
      - "package.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4

      # Task #73: Single-source-of-truth guard. apps/worker/wrangler.toml is
      # the only Worker config — a stray root wrangler.toml previously caused
      # a manual `wrangler deploy` from the repo root to silently ship a
      # Worker missing UPLOADS / AI / Vectorize / Workflow bindings.
      - name: Reject root wrangler.toml
        working-directory: ${{ github.workspace }}
        run: |
          if [ -e wrangler.toml ]; then
            echo "::error::Root wrangler.toml exists. apps/worker/wrangler.toml is the single source of truth — see apps/worker/README.md → 'Adding a new binding'." >&2
            exit 1
          fi
          echo "OK: no root wrangler.toml."

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/worker/package-lock.json

      - name: Install worker dependencies
        run: npm ci || npm install

      - name: Typecheck
        run: npm run typecheck

      # Task #8: ML Quality Ops regression gate — LOCAL pass.
      # Runs the bundled heuristic predictors against the committed
      # gold-set fixtures for the CANDIDATE commit and compares to
      # scripts/eval-baseline.json. Fails the deploy when any task
      # regresses more than 5pp. This is the primary gate — it
      # measures the commit being deployed, not the live worker.
      # Bypass with EVAL_LOCAL_SKIP=1 for emergency deploys.
      - name: ML eval regression gate (local — candidate commit)
        env:
          EVAL_LOCAL_THRESHOLD: "5"
        run: node scripts/eval-local.mjs

      # Task #8: ML Quality Ops regression gate — REMOTE belt-and-
      # suspenders pass. Queries the deployed worker's
      # /api/ml/eval/gate (which compares the two most recent `ok`
      # eval_runs per active dataset) and fails on >5% drift. Hard-
      # fails on 4xx/5xx (except 404 for first-deploy), soft-passes
      # on network error.
      - name: ML eval regression gate (remote — production drift)
        env:
          GATE_BASE_URL: https://api.aidatasignal.com
          GATE_THRESHOLD: "5"
        run: node scripts/eval-gate.mjs

      # Task #35: Pre-create any R2 buckets declared in wrangler.toml so
      # `wrangler deploy` doesn't 10085 on a missing bucket. The Cloudflare
      # API returns code 10004 when the bucket already exists, which we
      # treat as success. We extract bucket_name values from wrangler.toml
      # to keep the list authoritative in one place.
      - name: Ensure R2 buckets exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: 30c9362191318777b71647145decda48
        run: |
          set -euo pipefail
          BUCKETS=$(grep -E '^[[:space:]]*bucket_name[[:space:]]*=' wrangler.toml | sed -E 's/.*"([^"]+)".*/\1/' | sort -u)
          if [ -z "$BUCKETS" ]; then
            echo "No R2 buckets declared in wrangler.toml; skipping."
            exit 0
          fi
          for B in $BUCKETS; do
            echo "Ensuring R2 bucket: $B"
            RESP=$(curl -sS -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/r2/buckets" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"${B}\"}")
            if echo "$RESP" | grep -qE '"success":[[:space:]]*true'; then
              echo "  created."
            elif echo "$RESP" | grep -qE '"code":[[:space:]]*10004'; then
              echo "  already exists — ok."
            else
              echo "  unexpected response: $RESP" >&2
              exit 1
            fi
          done

      # Task #39: Pre-create Vectorize indexes declared in wrangler.toml.
      # The Cloudflare API returns code 3149 ("vector index already exists")
      # when the index is present, which we treat as success.
      #
      # wrangler.toml itself doesn't carry dimensions/metric, so each
      # [[vectorize]] block annotates them via a trailing comment on the
      # `index_name` line: `index_name = "foo"  # dim=768 metric=cosine`.
      # If the annotation is missing we fall back to 768/cosine (the
      # values used by every existing axal index — BGE base embeddings)
      # and emit a warning so a typo doesn't silently create the wrong
      # index shape.
      - name: Ensure Vectorize indexes exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: 30c9362191318777b71647145decda48
          VECTORIZE_DEFAULT_DIM: "768"
          VECTORIZE_DEFAULT_METRIC: "cosine"
        run: |
          set -euo pipefail
          # Emit `name<TAB>dim<TAB>metric` for every [[vectorize]] block,
          # parsing the optional `# dim=N metric=M` annotation on the
          # index_name line.
          PARSED=$(awk -v ddim="$VECTORIZE_DEFAULT_DIM" -v dmet="$VECTORIZE_DEFAULT_METRIC" '
            /^\[\[vectorize\]\]/ { flag=1; next }
            /^\[/ { flag=0 }
            flag && /^[[:space:]]*index_name[[:space:]]*=/ {
              name=""; dim=ddim; met=dmet
              if (match($0, /"[^"]+"/)) name=substr($0, RSTART+1, RLENGTH-2)
              if (match($0, /dim[[:space:]]*=[[:space:]]*[0-9]+/)) {
                s=substr($0, RSTART, RLENGTH); sub(/^dim[[:space:]]*=[[:space:]]*/, "", s); dim=s
              }
              if (match($0, /metric[[:space:]]*=[[:space:]]*[A-Za-z_-]+/)) {
                s=substr($0, RSTART, RLENGTH); sub(/^metric[[:space:]]*=[[:space:]]*/, "", s); met=s
              }
              if (name != "") printf "%s\t%s\t%s\n", name, dim, met
            }
          ' wrangler.toml | sort -u)
          if [ -z "$PARSED" ]; then
            echo "No Vectorize indexes declared in wrangler.toml; skipping."
            exit 0
          fi
          while IFS=$'\t' read -r I DIM METRIC; do
            [ -z "$I" ] && continue
            # Surface missing annotation so a future contributor doesn't
            # silently get the default shape.
            if ! grep -E "^[[:space:]]*index_name[[:space:]]*=[[:space:]]*\"${I}\".*dim=" wrangler.toml >/dev/null; then
              echo "WARNING: index '${I}' has no '# dim=N metric=M' annotation; defaulting to ${DIM}/${METRIC}." >&2
            fi
            echo "Ensuring Vectorize index: $I (dim=${DIM}, metric=${METRIC})"
            RESP=$(curl -sS -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/vectorize/v2/indexes" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"${I}\",\"config\":{\"dimensions\":${DIM},\"metric\":\"${METRIC}\"}}")
            if echo "$RESP" | grep -qE '"success":[[:space:]]*true'; then
              echo "  created."
            elif echo "$RESP" | grep -qE '"code":[[:space:]]*(3149|3002)' || echo "$RESP" | grep -qiE 'already exists|duplicate_name|duplicate name'; then
              echo "  already exists — ok."
            elif echo "$RESP" | grep -qE '"code":[[:space:]]*10000' || echo "$RESP" | grep -qi 'authentication error'; then
              # Task #69: code:10000 here means the CLOUDFLARE_API_TOKEN is
              # missing the Vectorize Edit scope. Fail hard so the operator
              # rotates the token — see apps/worker/README.md "Required
              # scopes for CLOUDFLARE_API_TOKEN".
              echo "  AUTH FAILURE: token is missing Vectorize Edit scope. Rotate CLOUDFLARE_API_TOKEN per apps/worker/README.md → 'Required scopes for CLOUDFLARE_API_TOKEN'." >&2
              echo "  raw response: $RESP" >&2
              exit 1
            else
              echo "  unexpected response: $RESP" >&2
              exit 1
            fi
          done <<< "$PARSED"

      # Task #39: Pre-create Queues declared in wrangler.toml. We extract
      # queue names from both [[queues.producers]] (`queue = "..."`) and
      # [[queues.consumers]] (`queue = "..."`) blocks. The Cloudflare API
      # returns code 100123 ("queue with this name already exists") when
      # the queue is present, which we treat as success.
      - name: Ensure Queues exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: 30c9362191318777b71647145decda48
        run: |
          set -euo pipefail
          QUEUES=$(awk '/^\[\[queues\.(producers|consumers)\]\]/{flag=1;next} /^\[/{flag=0} flag && /^[[:space:]]*queue[[:space:]]*=/' wrangler.toml \
            | sed -E 's/.*"([^"]+)".*/\1/' | sort -u)
          if [ -z "$QUEUES" ]; then
            echo "No Queues declared in wrangler.toml; skipping."
            exit 0
          fi
          for Q in $QUEUES; do
            echo "Ensuring Queue: $Q"
            RESP=$(curl -sS -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/queues" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"queue_name\":\"${Q}\"}")
            if echo "$RESP" | grep -qE '"success":[[:space:]]*true'; then
              echo "  created."
            elif echo "$RESP" | grep -qE '"code":[[:space:]]*(100123|11009)' || echo "$RESP" | grep -qiE 'already exists|already taken'; then
              echo "  already exists — ok."
            else
              echo "  unexpected response: $RESP" >&2
              exit 1
            fi
          done

      # Task #39: Analytics Engine datasets do NOT have a create-dataset
      # REST endpoint — Cloudflare auto-provisions a dataset the first
      # time the Worker calls `writeDataPoint` against it. We still parse
      # every `[[analytics_engine_datasets]]` block and probe the AE SQL
      # endpoint per dataset, treating three outcomes as success:
      #   1. `"success":true`         — dataset exists and is queryable.
      #   2. table-not-found error    — dataset hasn't received its first
      #      write yet; will be auto-provisioned by the Worker.
      #   3. (anything else)          — fail loudly so a bad token /
      #      account / typo surfaces here instead of in production.
      - name: Ensure Analytics Engine datasets are reachable
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: 30c9362191318777b71647145decda48
        run: |
          set -euo pipefail
          DATASETS=$(awk '/^\[\[analytics_engine_datasets\]\]/{flag=1;next} /^\[/{flag=0} flag && /^[[:space:]]*dataset[[:space:]]*=/' wrangler.toml \
            | sed -E 's/.*"([^"]+)".*/\1/' | sort -u)
          if [ -z "$DATASETS" ]; then
            echo "No Analytics Engine datasets declared in wrangler.toml; skipping."
            exit 0
          fi
          for D in $DATASETS; do
            echo "Probing Analytics Engine dataset: $D"
            RESP=$(curl -sS -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/analytics_engine/sql" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --data "SELECT 1 FROM \"${D}\" LIMIT 1")
            if echo "$RESP" | grep -qE '"success":[[:space:]]*true'; then
              echo "  exists and queryable — ok."
            elif echo "$RESP" | grep -qE '"meta"[[:space:]]*:' && echo "$RESP" | grep -qE '"data"[[:space:]]*:' && echo "$RESP" | grep -qE '"rows"[[:space:]]*:'; then
              # AE SQL endpoint returns raw ClickHouse JSON (no CF success
              # envelope) for successful queries. Presence of meta/data/rows
              # keys means the dataset is enabled and queryable.
              echo "  exists and queryable (ClickHouse response) — ok."
            elif echo "$RESP" | grep -qiE 'table.*not found|unknown table|no such table|does not exist'; then
              echo "  not yet written to — will be auto-provisioned on first writeDataPoint."
            elif echo "$RESP" | grep -qE '"code":[[:space:]]*10000' || echo "$RESP" | grep -qiE 'authentication error|authorization error'; then
              # AE datasets self-provision on the first writeDataPoint — a
              # missing Account Analytics: Read scope is not deploy-blocking.
              # Warn so the operator knows but do NOT exit 1.
              echo "  WARNING: token may be missing Account Analytics: Read scope; skipping probe." >&2
              echo "  AE dataset will be auto-provisioned by the Worker on first writeDataPoint." >&2
              echo "  raw response: $RESP" >&2
            else
              echo "  unexpected response: $RESP" >&2
              exit 1
            fi
          done

      # Task #39: Pre-create KV namespaces declared in wrangler.toml.
      # Cloudflare KV is unusual in that wrangler.toml binds a namespace
      # by its account-scoped `id`, not by name — so even when CI creates
      # the namespace, the returned id still has to be hand-pasted into
      # wrangler.toml on first introduction. This step therefore covers
      # the easy case (the namespace title doesn't yet exist for the
      # account) and emits a clear ACTION REQUIRED line with the new id
      # so the operator can paste it back. Subsequent deploys are no-ops
      # because the title already exists (CF returns code 10014).
      - name: Ensure KV namespaces exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: 30c9362191318777b71647145decda48
        run: |
          set -euo pipefail
          BINDINGS=$(awk '/^\[\[kv_namespaces\]\]/{flag=1;next} /^\[/{flag=0} flag && /^[[:space:]]*binding[[:space:]]*=/' wrangler.toml \
            | sed -E 's/.*"([^"]+)".*/\1/' | sort -u)
          if [ -z "$BINDINGS" ]; then
            echo "No KV namespaces declared in wrangler.toml; skipping."
            exit 0
          fi
          for B in $BINDINGS; do
            echo "Ensuring KV namespace title: $B"
            RESP=$(curl -sS -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"title\":\"${B}\"}")
            if echo "$RESP" | grep -qE '"success":[[:space:]]*true'; then
              NEW_ID=$(echo "$RESP" | jq -r '.result.id')
              echo "  created (id=${NEW_ID})."
              echo "  ACTION REQUIRED: paste id=${NEW_ID} into the [[kv_namespaces]] block for binding ${B} in apps/worker/wrangler.toml." >&2
            elif echo "$RESP" | grep -qE '"code":[[:space:]]*10014' || echo "$RESP" | grep -qi 'already exists'; then
              echo "  already exists — ok."
            else
              echo "  unexpected response: $RESP" >&2
              exit 1
            fi
          done

      # Task #43: Detect drift between wrangler.toml and the live Cloudflare
      # account. The "Ensure …" steps above create anything declared in
      # wrangler.toml; this step does the inverse and lists what actually
      # lives in the account, then compares.
      #
      # Two outcomes per resource kind:
      #   - ORPHAN  — exists in the CF account but no [[…]] block in
      #               wrangler.toml references it. Non-fatal (someone may
      #               be pruning a binding intentionally and want to keep
      #               the data around) but loud, because orphans cost
      #               money and rot quietly.
      #   - DRIFT   — exists on both sides but the live config doesn't
      #               match what we'd create. Currently only checked for
      #               Vectorize (dimensions / metric) because that's the
      #               only kind where wrangler.toml carries enough shape
      #               to compare and where the wrong shape silently
      #               corrupts queries. Drift is FATAL.
      #
      # Anything orphaned is matched against an opt-in allowlist
      # (`apps/worker/.cf-orphan-allowlist`) so known-and-accepted
      # leftovers don't spam the workflow output. Lines starting with
      # `#` are comments; one resource name per line; the file is
      # optional.
      - name: Detect Cloudflare resource drift
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: 30c9362191318777b71647145decda48
          VECTORIZE_DEFAULT_DIM: "768"
          VECTORIZE_DEFAULT_METRIC: "cosine"
        run: |
          set -euo pipefail

          ALLOWLIST_FILE=".cf-orphan-allowlist"
          load_allowlist() {
            if [ -f "$ALLOWLIST_FILE" ]; then
              grep -vE '^[[:space:]]*(#|$)' "$ALLOWLIST_FILE" | sed -E 's/[[:space:]]+$//'
            fi
          }
          ALLOWED=$(load_allowlist || true)
          is_allowed() {
            local n="$1"
            [ -z "$ALLOWED" ] && return 1
            echo "$ALLOWED" | grep -Fxq "$n"
          }

          DRIFT_FATAL=0
          ORPHAN_COUNT=0
          DRIFT_COUNT=0

          # Fetch a CF API URL and assert top-level "success":true. Echos the
          # raw JSON on stdout when ok, fails the step with the error payload
          # otherwise — so a bad token / scope surfaces here instead of
          # silently producing empty lists (which would look like "no
          # orphans" and hide real drift).
          cf_get() {
            local url="$1"
            local resp
            resp=$(curl -sS "$url" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
            if [ "$(echo "$resp" | jq -r '.success')" != "true" ]; then
              echo "Cloudflare API call failed: $url" >&2
              echo "$resp" >&2
              exit 1
            fi
            echo "$resp"
          }

          echo "::group::R2 bucket drift"
          DECLARED_R2=$(grep -E '^[[:space:]]*bucket_name[[:space:]]*=' wrangler.toml | sed -E 's/.*"([^"]+)".*/\1/' | sort -u)
          LIVE_R2=$(cf_get "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/r2/buckets" \
            | jq -r '.result.buckets[]?.name' | sort -u)
          echo "declared: $(echo "$DECLARED_R2" | tr '\n' ' ')"
          echo "live:     $(echo "$LIVE_R2" | tr '\n' ' ')"
          for B in $LIVE_R2; do
            if ! echo "$DECLARED_R2" | grep -Fxq "$B"; then
              if is_allowed "$B"; then
                echo "  allowlisted-orphan: $B"
              else
                echo "  ORPHAN R2 bucket: $B (not referenced from wrangler.toml)" >&2
                ORPHAN_COUNT=$((ORPHAN_COUNT+1))
              fi
            fi
          done
          echo "::endgroup::"

          echo "::group::Queue drift"
          DECLARED_Q=$(awk '/^\[\[queues\.(producers|consumers)\]\]/{flag=1;next} /^\[/{flag=0} flag && /^[[:space:]]*queue[[:space:]]*=/' wrangler.toml \
            | sed -E 's/.*"([^"]+)".*/\1/' | sort -u)
          LIVE_Q=$(cf_get "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/queues" \
            | jq -r '.result[]?.queue_name' | sort -u)
          echo "declared: $(echo "$DECLARED_Q" | tr '\n' ' ')"
          echo "live:     $(echo "$LIVE_Q" | tr '\n' ' ')"
          for Q in $LIVE_Q; do
            if ! echo "$DECLARED_Q" | grep -Fxq "$Q"; then
              if is_allowed "$Q"; then
                echo "  allowlisted-orphan: $Q"
              else
                echo "  ORPHAN Queue: $Q (not referenced from wrangler.toml)" >&2
                ORPHAN_COUNT=$((ORPHAN_COUNT+1))
              fi
            fi
          done
          echo "::endgroup::"

          echo "::group::Vectorize drift"
          # name<TAB>dim<TAB>metric for each declared index.
          DECLARED_VEC=$(awk -v ddim="$VECTORIZE_DEFAULT_DIM" -v dmet="$VECTORIZE_DEFAULT_METRIC" '
            /^\[\[vectorize\]\]/ { flag=1; next }
            /^\[/ { flag=0 }
            flag && /^[[:space:]]*index_name[[:space:]]*=/ {
              name=""; dim=ddim; met=dmet
              if (match($0, /"[^"]+"/)) name=substr($0, RSTART+1, RLENGTH-2)
              if (match($0, /dim[[:space:]]*=[[:space:]]*[0-9]+/)) {
                s=substr($0, RSTART, RLENGTH); sub(/^dim[[:space:]]*=[[:space:]]*/, "", s); dim=s
              }
              if (match($0, /metric[[:space:]]*=[[:space:]]*[A-Za-z_-]+/)) {
                s=substr($0, RSTART, RLENGTH); sub(/^metric[[:space:]]*=[[:space:]]*/, "", s); met=s
              }
              if (name != "") printf "%s\t%s\t%s\n", name, dim, met
            }
          ' wrangler.toml | sort -u)
          # name<TAB>dim<TAB>metric for each live index.
          LIVE_VEC=$(cf_get "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/vectorize/v2/indexes" \
            | jq -r '.result[]? | [.name, (.config.dimensions|tostring), .config.metric] | @tsv' | sort -u)
          echo "declared:"; echo "$DECLARED_VEC" | sed 's/^/  /'
          echo "live:"; echo "$LIVE_VEC" | sed 's/^/  /'
          DECLARED_VEC_NAMES=$(echo "$DECLARED_VEC" | awk -F'\t' '{print $1}' | sort -u)
          LIVE_VEC_NAMES=$(echo "$LIVE_VEC" | awk -F'\t' '{print $1}' | sort -u)
          for I in $LIVE_VEC_NAMES; do
            [ -z "$I" ] && continue
            if ! echo "$DECLARED_VEC_NAMES" | grep -Fxq "$I"; then
              if is_allowed "$I"; then
                echo "  allowlisted-orphan: $I"
              else
                echo "  ORPHAN Vectorize index: $I (not referenced from wrangler.toml)" >&2
                ORPHAN_COUNT=$((ORPHAN_COUNT+1))
              fi
            fi
          done
          # Drift: for each name present on both sides, compare dim+metric.
          while IFS=$'\t' read -r I DIM MET; do
            [ -z "$I" ] && continue
            LIVE_ROW=$(echo "$LIVE_VEC" | awk -F'\t' -v n="$I" '$1==n {print; exit}')
            [ -z "$LIVE_ROW" ] && continue
            LIVE_DIM=$(echo "$LIVE_ROW" | awk -F'\t' '{print $2}')
            LIVE_MET=$(echo "$LIVE_ROW" | awk -F'\t' '{print $3}')
            if [ "$DIM" != "$LIVE_DIM" ] || [ "$MET" != "$LIVE_MET" ]; then
              echo "  DRIFT Vectorize index: $I declared dim=${DIM}/metric=${MET} but live is dim=${LIVE_DIM}/metric=${LIVE_MET}" >&2
              DRIFT_FATAL=1
              DRIFT_COUNT=$((DRIFT_COUNT+1))
            fi
          done <<< "$DECLARED_VEC"
          echo "::endgroup::"

          echo "Drift summary: ${ORPHAN_COUNT} orphan(s), ${DRIFT_COUNT} drifted resource(s)."
          if [ "$DRIFT_FATAL" -ne 0 ]; then
            echo "Fatal drift detected (see DRIFT lines above). Failing the deploy." >&2
            exit 1
          fi

      # Task #40: Apply pending D1 migrations BEFORE the Worker deploy.
      # `wrangler d1 migrations apply` is idempotent — already-applied
      # migrations are tracked in the d1_migrations table and skipped on
      # subsequent runs. Running this before the deploy means the schema
      # is always at-or-ahead of the code that's about to ship, which
      # eliminates the "no such table" production crashes that happened
      # when migrations shipped in the repo but were never applied.
      # `set -e` (default) + the action's non-zero exit on failed
      # migrations halts the workflow before `wrangler deploy` runs.
      - name: Apply D1 migrations (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 30c9362191318777b71647145decda48
        run: npx --yes wrangler@3.99.0 d1 migrations apply DB --remote

      - name: Deploy via wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/worker
          wranglerVersion: "3.99.0"
