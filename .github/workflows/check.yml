name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  worker:
    name: Worker (typecheck + lint + gates + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # Node 22 is required: the test suite uses `node:sqlite`
          # (DatabaseSync) which is only available in Node 22+.
          node-version: 22
          cache: npm
          cache-dependency-path: apps/worker/package-lock.json
      - run: npm ci

      # Strict typecheck: tsc --noEmit + the strict-flag tsconfig that gates
      # noUncheckedIndexedAccess / exactOptionalPropertyTypes / noImplicitOverride
      # / noFallthroughCasesInSwitch on all new (Task #27) modules.
      - name: Typecheck
        run: npm run typecheck

      # Lint is blocking — only `error`-level rules fail the build.
      # Style warnings remain warnings (see .eslintrc.cjs).
      - name: Lint
        run: npm run lint --silent -- --max-warnings=9999

      # ---- Hard gates: block specific anti-patterns in *new* code only. ----
      # Compares against the PR base (or HEAD~1 for direct pushes), so the
      # legacy 192-file baseline isn't blocked, but newly introduced code is.
      - name: "Gate: no bare console.error in new code"
        shell: bash
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}" --depth=1 || true
          else
            BASE="HEAD~1"
          fi
          CHANGED=$(git -C "$GITHUB_WORKSPACE" diff --name-only --diff-filter=AM "$BASE"...HEAD -- 'apps/worker/src/**/*.ts' || true)
          [ -z "$CHANGED" ] && { echo "no changed worker ts files"; exit 0; }
          echo "Scanning new lines in: $CHANGED"
          BAD=0
          for f in $CHANGED; do
            ADDED=$(git -C "$GITHUB_WORKSPACE" diff "$BASE"...HEAD -- "$f" | grep -E '^\+[^+]' | grep -E 'console\.(error|warn)\(' || true)
            if [ -n "$ADDED" ]; then
              echo "::error file=$f::new bare console.error/warn — use logError(env, {err}) from src/db/error_log.ts"
              echo "$ADDED"
              BAD=1
            fi
          done
          exit $BAD

      - name: "Gate: no SQL string interpolation in new code"
        shell: bash
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}" --depth=1 || true
          else
            BASE="HEAD~1"
          fi
          CHANGED=$(git -C "$GITHUB_WORKSPACE" diff --name-only --diff-filter=AM "$BASE"...HEAD -- 'apps/worker/src/**/*.ts' || true)
          [ -z "$CHANGED" ] && exit 0
          BAD=0
          for f in $CHANGED; do
            # Match added lines containing a SQL keyword AND a `${ ... }` interpolation in the same template literal context.
            ADDED=$(git -C "$GITHUB_WORKSPACE" diff "$BASE"...HEAD -- "$f" \
              | grep -E '^\+[^+]' \
              | grep -iE '(SELECT|INSERT|UPDATE|DELETE|CREATE|ALTER|DROP)[^"`]*\$\{' || true)
            if [ -n "$ADDED" ]; then
              echo "::error file=$f::SQL string interpolation in new code — use prepare(...).bind(...) parameter binding"
              echo "$ADDED"
              BAD=1
            fi
          done
          exit $BAD

      - name: "Gate: no fetch() without AbortSignal/timeout in new code"
        shell: bash
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}" --depth=1 || true
          else
            BASE="HEAD~1"
          fi
          CHANGED=$(git -C "$GITHUB_WORKSPACE" diff --name-only --diff-filter=AM "$BASE"...HEAD -- 'apps/worker/src/**/*.ts' || true)
          [ -z "$CHANGED" ] && exit 0
          BAD=0
          for f in $CHANGED; do
            ADDED=$(git -C "$GITHUB_WORKSPACE" diff "$BASE"...HEAD -- "$f" \
              | grep -E '^\+[^+]' \
              | grep -E '(^|[^a-zA-Z_])fetch\(' \
              | grep -vE '(signal|AbortSignal|httpFetch|env\.[A-Z_]+\.fetch|BROWSER\.fetch|AI_SEARCH\.fetch)' || true)
            if [ -n "$ADDED" ]; then
              echo "::error file=$f::raw fetch() without signal/timeout — use httpFetch() with AbortSignal.timeout(...)"
              echo "$ADDED"
              BAD=1
            fi
          done
          exit $BAD

      - name: Test
        run: npm test

  site:
    name: Site (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4

      # `apps/site/vendor/bundle` is committed (the static deployment builds
      # from it) and carries native extensions — bigdecimal, ffi,
      # eventmachine, google-protobuf — compiled against the exact libruby of
      # whatever machine built them (`libruby-3.2.2.so.3.2`). The runner ships
      # a different Ruby 3.2 patch build, so reusing them fails at load with
      # "libruby-3.2.2.so.3.2: cannot open shared object file".
      #
      # Point bundler at a runner-local path so CI compiles gems against the
      # Ruby it actually runs. BUNDLE_APP_CONFIG is required as well as
      # BUNDLE_PATH: a local `.bundle/config` (which pins `vendor/bundle`)
      # outranks the BUNDLE_PATH env var on its own. Neither the committed
      # gem tree nor `.bundle/config` is modified.
      - name: Point bundler away from the committed vendor/bundle
        run: |
          echo "BUNDLE_APP_CONFIG=$RUNNER_TEMP/bundle-config" >> "$GITHUB_ENV"
          echo "BUNDLE_PATH=$RUNNER_TEMP/bundle" >> "$GITHUB_ENV"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          working-directory: apps/site

      # Not `bundler-cache: true`: that installs into `vendor/bundle` before
      # the step above can take effect, which is the failure this avoids.
      - name: Install gems
        run: bundle install --jobs 4 --retry 3

      - run: bundle exec jekyll build --destination /tmp/site-build
