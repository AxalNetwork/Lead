name = "lead"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]
account_id = "30c9362191318777b71647145decda48"

workers_dev = false

# Browser Rendering binding for the fetcher tier-1 fallback. Declared at the
# top of the file so TOML doesn't accidentally nest it under a later table.
browser = { binding = "BROWSER" }

[vars]
ALLOWED_EMAIL = "guillaumelauzier@gmail.com"
ACCESS_TEAM_DOMAIN = "axalnetwork.cloudflareaccess.com"
ACCESS_AUD = "f9cbce05165afb5af93e5929ff93dc4591aa18cd8234244327e78fd29fa849dd"
ACCESS_APP_AUD = "3677234625cd7a8a9065c46ec41ab908bb7a24cfbc0c20169477305327cb3e79"

# Task #25: Cloudflare-native AI stack budget ceilings.
AI_DAILY_NEURONS_CAP = "1000000"
VECTORIZE_DAILY_QUERIES_CAP = "100000"
AI_SEARCH_NAMESPACE = "axal-profiles"
AI_EXTRACT_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
AI_EMBED_MODEL = "@cf/baai/bge-base-en-v1.5"
AI_OCR_MODEL = "@cf/unum/uform-gen2-qwen-500m"

# Per-provider daily budget caps (USD). 0 disables, blank uses the conservative default.
HUNTER_DAILY_USD = "5"
APOLLO_DAILY_USD = "5"
ROCKETREACH_DAILY_USD = "5"
PEOPLEDATALABS_DAILY_USD = "5"
PROXYCURL_DAILY_USD = "5"
CRUNCHBASE_DAILY_USD = "5"
SEC_EDGAR_DAILY_USD = "0"
OPENCORPORATES_DAILY_USD = "2"
UK_CH_DAILY_USD = "0"
FORBES_SIGNALS_DAILY_USD = "1"
WHOISXML_DAILY_USD = "1"
TWITTER_OSS_DAILY_USD = "0"
ENRICHMENT_KV_TTL_DAYS = "14"
NITTER_BASE = "https://nitter.net"
SEC_EDGAR_UA = "AIDataSignal/1.0 contact@aidatasignal.com"

# Task #2: per-aggregator page budgets. Each value caps how many index
# pages the importer will walk before stopping. Operators can tune these
# without a code change. Defaults applied in code when unset.
AGG_VCSHEET_MAX_PAGES = "8"
AGG_VCSTACK_MAX_PAGES = "6"
AGG_LANDSCAPE_VC_MAX_PAGES = "10"
AGG_CLIMATESCAPE_MAX_PAGES = "8"

# Task #3: Wikipedia importer follows up to N firm articles per import
# to extract Infobox AUM/founded/HQ fields. Bounded so a 500-firm list
# doesn't trigger 500 fetches.
AGG_WIKIPEDIA_INFOBOX_CAP = "300"

# Task #3: profile classifier ideology axes. Set to "off" to disable the
# political-ideology axes entirely (the five axes stay NULL on every row).
CLASSIFIER_IDEOLOGY = "on"

# Task #3 (research agent): per-owner daily token budget. Sized to keep
# every operator inside the AI_DAILY_NEURONS_CAP shared ceiling.
AGENT_DAILY_TOKEN_BUDGET = "200000"
AGENT_FALLBACK_PROVIDER = "openai"
# Set to "true" to enable the Canadian Open Parliament adapter (no key).
OPENPARLIAMENT_ENABLED = "true"

[[d1_databases]]
binding = "DB"
database_name = "aidatasignal-leads"
database_id = "ecd7272e-533d-4e01-81ba-e1b98bce6e1c"

[[kv_namespaces]]
binding = "SESSIONS"
id = "302eb1a32ae64ce588dee452e14b3217"

# Per-host rate limit + 24h scrape cache
[[kv_namespaces]]
binding = "SCRAPE_CACHE"
id = "fe0a5d907b9841f98914f3076500e75d"

# Raw HTML archive (one object per fetched URL/day)
[[r2_buckets]]
binding = "RAW_HTML"
bucket_name = "aidatasignal-raw-html"

# Uploaded spreadsheet/PDF files (Task #22). One object per upload, keyed
# uploads/{importId}/{filename}.
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "aidatasignal-uploads"

# Task #25: AI extractor / embedding response cache. 30-day TTL via R2 lifecycle.
[[r2_buckets]]
binding = "AI_CACHE"
bucket_name = "aidatasignal-ai-cache"

# Task #25: Workers AI binding (extraction, embeddings, arbitration, OCR).
[ai]
binding = "AI"

# Task #25: Vectorize indexes for entity resolution. 768-dim BGE base embeddings.
# Task #39: dimensions + metric are encoded as a trailing comment on the
# `index_name` line (`# dim=N metric=METRIC`) so the deploy workflow can
# create each index with the correct shape. wrangler itself ignores the
# comment.
[[vectorize]]
binding = "VEC_LEADS"
index_name = "axal-leads-768"  # dim=768 metric=cosine

[[vectorize]]
binding = "VEC_FIRMS"
index_name = "axal-firms-768"  # dim=768 metric=cosine

[[vectorize]]
binding = "VEC_COMPANIES"
index_name = "axal-companies-768"  # dim=768 metric=cosine

# Task #44: prospect accounts vector index.
[[vectorize]]
binding = "VEC_ACCOUNTS"
index_name = "axal-accounts-768"  # dim=768 metric=cosine

# Task #46: persona embeddings (re-embedded on every PATCH; queried for
# the dashboard "Top 25 matches now" preview pane).
[[vectorize]]
binding = "VEC_PERSONAS"
index_name = "axal-personas-768"  # dim=768 metric=cosine

# Task #47: project embeddings for the multi-audience matching workspace.
[[vectorize]]
binding = "VEC_PROJECTS"
index_name = "axal-projects-768"  # dim=768 metric=cosine

# Task #25: Durable Object for serialized merge locks (per-entity).
[[durable_objects.bindings]]
name = "ENTITY_LOCK"
class_name = "EntityLock"

[[migrations]]
tag = "v1-task25"
new_sqlite_classes = ["EntityLock"]

# Task #25: Analytics Engine high-volume metrics dataset.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "axal_events"

# Task #25: Cloudflare Images binding for avatars + logos.
[images]
binding = "IMAGES"

# Task #25: Rate Limiter bindings — per-host (60/min) + global AI (600/min).
[[unsafe.bindings]]
name = "RL_HOST"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[unsafe.bindings]]
name = "RL_AI"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 600, period = 60 }

# Task #25: Workflow entrypoints — durable enrichment + ingestion chains.
[[workflows]]
binding = "WF_ENRICH_LEAD"
name = "enrich-lead"
class_name = "EnrichLeadWorkflow"

[[workflows]]
binding = "WF_ENRICH_FIRM"
name = "enrich-firm"
class_name = "EnrichFirmWorkflow"

[[workflows]]
binding = "WF_INGEST_PAGE"
name = "ingest-page"
class_name = "IngestPageWorkflow"

# Task #44: prospect-account enrichment workflow.
[[workflows]]
binding = "WF_ENRICH_ACCOUNT"
name = "enrich-account"
class_name = "EnrichAccountWorkflow"

# Task #45: hourly buyer-signal crawl.
[[workflows]]
binding = "WF_CRAWL_SIGNALS"
name = "crawl-signals"
class_name = "CrawlSignalsWorkflow"

# Task #46: durable per-persona rescore. Triggered on persona create /
# patch / clone / explicit rescore-all. Pages every entity of the
# persona's kind in batches of 200 and upserts persona_matches.
[[workflows]]
binding = "WF_RESCORE_PERSONA"
name = "rescore-persona"
class_name = "RescorePersonaWorkflow"

# Task #47: durable per-project match recompute. Triggered on create /
# patch / nightly cron / manual recompute. Fans out to the five
# audiences and upserts project_matches rows.
[[workflows]]
binding = "WF_MATCH_PROJECT"
name = "match-project"
class_name = "MatchProjectWorkflow"

# Task #3: per-entity DD scan. Triggered on POST /api/dd/scan/:id/dispatch,
# inside the batch workflow, and on demand from the dashboard.
[[workflows]]
binding = "WF_DD_SCAN_ENTITY"
name = "dd-scan-entity"
class_name = "DDScanEntityWorkflow"

# Task #3: nightly DD batch scan. Refreshes watchlist cache then scans
# the next N due entities (oldest-scanned-first), bounded so a single
# tick can't melt the queue.
[[workflows]]
binding = "WF_DD_SCAN_BATCH"
name = "dd-scan-batch"
class_name = "DDScanBatchWorkflow"

# Task #2: per-entity news refresh workflow. Triggered on POST
# /api/news/refresh/:entityId/dispatch and inside the EnrichLeadWorkflow.
[[workflows]]
binding = "WF_REFRESH_NEWS"
name = "refresh-news"
class_name = "RefreshNewsWorkflow"

# Task #3: per-entity profile classification (types + ideology + influence
# + AI summary). Triggered on POST /api/profile/classify/:id/dispatch.
[[workflows]]
binding = "WF_CLASSIFY_ENTITY"
name = "classify-entity"
class_name = "ClassifyEntityWorkflow"

# Task #3: nightly batch classifier — runs from the `0 4 * * *` cron
# after the DD batch (piggybacks the existing slot).
[[workflows]]
binding = "WF_CLASSIFY_BATCH"
name = "classify-batch"
class_name = "ClassifyBatchWorkflow"

# Task #3: refresh government appointments + political donations for a
# single entity without re-running the full classifier.
[[workflows]]
binding = "WF_REFRESH_GOVERNMENT"
name = "refresh-government"
class_name = "RefreshGovernmentWorkflow"

# Task #3: nightly refresh of saved research entries.
[[workflows]]
binding = "WF_REFRESH_SAVED_RESEARCH"
name = "refresh-saved-research"
class_name = "RefreshSavedResearchWorkflow"

# Task #2: link discovery — seed fan-out + frontier crawler.
[[workflows]]
binding = "WF_DISCOVER_FROM_SEED"
name = "discover-from-seed"
class_name = "DiscoverFromSeedWorkflow"

[[workflows]]
binding = "WF_CRAWL_FRONTIER"
name = "crawl-frontier"
class_name = "CrawlFrontierWorkflow"

# Task #2 (monitoring): per-entity diff + trigger + channel dispatch.
[[workflows]]
binding = "WF_MONITOR_ENTITY"
name = "monitor-entity"
class_name = "MonitorEntityWorkflow"

# Task #2 (monitoring): batch sweep — picks due entities, runs per-entity
# inline (work is small), re-evaluates smart watchlists, retries pending
# webhook deliveries.
[[workflows]]
binding = "WF_MONITOR_BATCH"
name = "monitor-batch"
class_name = "MonitorBatchWorkflow"

# Task #2 (monitoring): hourly digest rollup. Drains `digest_queue` rows
# whose scheduled_for has come due and sends one email per (owner, watchlist).
[[workflows]]
binding = "WF_DIGEST"
name = "monitor-digest"
class_name = "DigestWorkflow"

# Task #3 (this task): per-entity OSINT resolve workflow. Runs the
# 10-pivot framework with a 60s wall-clock budget + EntityLock.
[[workflows]]
binding = "WF_OSINT_RESOLVE_ENTITY"
name = "osint-resolve-entity"
class_name = "OSINTResolveEntityWorkflow"

# Task #3: nightly OSINT batch — picks stalest entities + resolves them.
[[workflows]]
binding = "WF_OSINT_BATCH"
name = "osint-batch"
class_name = "OSINTBatchWorkflow"

# Task #3: nightly 90-day re-verification sweep — demotes dead handles.
[[workflows]]
binding = "WF_OSINT_REVERIFY"
name = "osint-reverify"
class_name = "OSINTReverifyWorkflow"

[[queues.producers]]
binding = "LEAD_QUEUE"
queue = "aidatasignal-lead-jobs"

[[queues.consumers]]
queue = "aidatasignal-lead-jobs"
max_batch_size = 10
max_batch_timeout = 5

[[routes]]
pattern = "api.aidatasignal.com"
custom_domain = true

[triggers]
# Free plan caps cron triggers at 5 per Worker. We use 4:
#   `0 * * * *`     hourly — buyer-signal crawl (Task #45).
#   `0 */6 * * *`   every 6h — re-scrape stale sources + re-enrich stale leads.
#   `15 3 * * *`    nightly — runs ALL nightly jobs sequentially:
#       analytics aggregator → account-score refresh → investor stats
#       → relationship derivation → project match refresh.
#   `0 4 * * *`     daily — Task #3 DD watchlist refresh + batch scan
#       (refreshes OpenSanctions/OFAC/EU/UN/UK_HMT snapshots into R2 then
#       scans the next N due entities oldest-first).
#   `30 4 * * *`    daily — Task #3 (research agent) nightly saved-research
#       refresh: re-runs every saved question and diffs the new answer.
crons = ["0 * * * *", "0 */6 * * *", "15 3 * * *", "0 4 * * *", "30 4 * * *"]
