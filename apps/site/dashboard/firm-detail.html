---
layout: default
title: Firm detail
permalink: /dashboard/firms/detail/
---

<div id="ads-firm-detail" data-loading>
  <div class="ads-card"><p class="ads-muted">Loading firm…</p></div>
</div>

<template id="ads-firm-tpl">
  <div class="ads-card" style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px">
    <div style="display:flex;gap:12px;align-items:center">
      <img data-k="logo" alt="" style="width:48px;height:48px;border-radius:6px;object-fit:cover;background:#eef" hidden>
      <div>
        <h1 class="ads-page-title" data-k="name" style="margin:0">—</h1>
        <p class="ads-muted" style="margin:2px 0 0;font-size:13px"><span data-k="kind"></span> · <span data-k="hq"></span> · founded <span data-k="founded"></span> · AUM <span data-k="aum"></span> · <span data-k="lead_or_co"></span> · <a data-k="website" target="_blank" rel="noopener"></a></p>
      </div>
    </div>
    <div style="display:flex;gap:6px">
      <button class="ads-btn ads-btn--ghost" data-act="edit">Edit</button>
      <button class="ads-btn ads-btn--ghost" data-act="enrich">Enrich</button>
      <a class="ads-btn ads-btn--ghost" data-act="dd" data-k="dd-link" href="#" title="Due diligence">DD</a>
      <button class="ads-btn ads-btn--ghost" type="button" title="Jump to the News tab" onclick="document.querySelector('#ads-firm-tabs .ads-tab[data-tab=&quot;news&quot;]')?.click();">News</button>
      <button class="ads-btn ads-btn--ghost" data-act="archive">Archive</button>
      <button class="ads-btn ads-btn--ghost" data-act="export">Export</button>
    </div>
  </div>

  <div class="ads-card" style="margin-top:12px">
    <div class="ads-tabs" id="ads-firm-tabs">
      <button class="ads-tab active" data-tab="overview">Overview</button>
      <button class="ads-tab" data-tab="people">People</button>
      <button class="ads-tab" data-tab="portfolio">Portfolio</button>
      <button class="ads-tab" data-tab="relationships">Relationships</button>
      <button class="ads-tab" data-tab="history">History</button>
      <button class="ads-tab" data-tab="sources">Sources</button>
      <button class="ads-tab" data-tab="news">News & citations</button>
    </div>

    <section data-pane="overview">
      <h3 style="margin:12px 0 4px;font-size:14px">Thesis</h3>
      <p data-k="thesis" class="ads-muted">—</p>
      <div class="ads-overview-grid" style="margin-top:8px;font-size:13px">
        <div><strong>Stages</strong><div data-k="stages">—</div></div>
        <div><strong>Sectors</strong><div data-k="sectors">—</div></div>
        <div><strong>Geo focus</strong><div data-k="geo_focus">—</div></div>
        <div><strong>Check size (typ)</strong><div data-k="check_typical">—</div></div>
        <div><strong>Check size range</strong><div data-k="check_range">—</div></div>
        <div><strong>Contact email</strong><div data-k="contact_email">—</div></div>
      </div>
    </section>

    <section data-pane="people" hidden>
      <div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0 4px">
        <h3 style="margin:0;font-size:14px">Team</h3>
        <div style="display:flex;gap:6px">
          <button class="ads-btn ads-btn--ghost" data-act="find-team">Find Team</button>
          <button class="ads-btn ads-btn--ghost" data-act="add-person">Add person…</button>
        </div>
      </div>
      <div class="ads-table-wrap">
      <table class="ads-table" style="width:100%;border-collapse:collapse">
        <thead><tr><th>Name</th><th>Role</th><th>DM?</th><th>Email</th><th>LinkedIn</th><th>Country</th><th>Last enriched</th></tr></thead>
        <tbody data-k="people-rows"></tbody>
      </table>
      </div>
    </section>

    <section data-pane="portfolio" hidden>
      <h3 style="margin:12px 0 4px;font-size:14px">Portfolio</h3>
      <div class="ads-table-wrap">
      <table class="ads-table" style="width:100%;border-collapse:collapse">
        <thead><tr><th>Company</th><th>Domain</th><th>Year</th><th>Stage</th><th>Amount</th><th>Lead?</th><th>Outcome</th><th>Exit value</th></tr></thead>
        <tbody data-k="portfolio-rows"></tbody>
      </table>
      </div>
    </section>

    <section data-pane="relationships" hidden>
      <div class="ads-split-2" style="padding:8px">
        <div>
          <h4 style="margin:0 0 6px;font-size:13px">Co-invested-with</h4>
          <div class="ads-table-wrap">
          <table class="ads-table" style="width:100%;border-collapse:collapse;font-size:12px">
            <thead><tr><th>Firm</th><th>Shared deals</th></tr></thead>
            <tbody data-k="coinvestors-rows"><tr><td colspan="2" class="ads-muted">Loading…</td></tr></tbody>
          </table>
          </div>
        </div>
        <div>
          <h4 style="margin:0 0 6px;font-size:13px">Path to another firm</h4>
          <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
            <input data-k="path-firm-input" placeholder="Search firm by name" style="flex:1;padding:4px 8px;border:1px solid #e5e5ea;border-radius:4px">
            <button class="ads-btn ads-btn--ghost" data-act="path-go">Find path</button>
          </div>
          <div data-k="path-result" style="font-size:12px;color:#444"></div>
        </div>
      </div>
      <div data-k="rel-graph" style="padding:8px"></div>
    </section>

    <section data-pane="history" hidden>
      <h3 style="margin:12px 0 4px;font-size:14px">Audit history</h3>
      <div class="ads-table-wrap">
      <table class="ads-table" style="width:100%;border-collapse:collapse">
        <thead><tr><th>When</th><th>Field</th><th>Old</th><th>New</th><th>Source</th><th>By</th></tr></thead>
        <tbody data-k="history-rows"></tbody>
      </table>
      </div>
    </section>

    <section data-pane="news" hidden>
      <h3 style="margin:12px 0 4px;font-size:14px">News & citations</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
        <button id="ads-news-refresh" class="ads-btn" type="button">Refresh now</button>
        <button id="ads-news-dispatch" class="ads-btn" type="button">Queue refresh</button>
        <label style="font-size:12px;color:var(--ads-muted)">Min rep:
          <select id="ads-news-min-rep" style="margin-left:6px">
            <option value="0">All</option><option value="0.5">≥0.5</option>
            <option value="0.7" selected>≥0.7</option><option value="0.9">≥0.9</option>
          </select></label>
        <label style="font-size:12px;color:var(--ads-muted)">Sentiment:
          <select id="ads-news-sent" style="margin-left:6px">
            <option value="">Any</option><option value="pos">Positive</option>
            <option value="neutral">Neutral</option><option value="neg">Negative</option>
          </select></label>
        <input id="ads-news-topic" type="text" placeholder="Topic filter…" style="padding:4px 8px;font-size:12px">
        <button id="ads-news-apply" class="ads-btn" type="button" style="font-size:12px;padding:4px 10px">Apply</button>
      </div>
      <div class="ads-form-msg" id="ads-news-msg" style="margin-bottom:6px"></div>
      <h4 style="margin:8px 0 4px;font-size:13px">Timeline <span class="ads-muted" id="ads-news-count" style="font-size:11px"></span></h4>
      <div id="ads-news-timeline"><div class="ads-loading">Open the tab to load news…</div></div>
      <h4 style="margin:12px 0 4px;font-size:13px">Verified facts <span class="ads-muted" style="font-size:11px">(hover a value for citations)</span></h4>
      <div id="ads-news-facts"><div class="ads-loading">…</div></div>
      <h4 style="margin:12px 0 4px;font-size:13px">Coverage</h4>
      <div id="ads-news-coverage"><div class="ads-loading">…</div></div>
    </section>

    <section data-pane="sources" hidden>
      <h3 style="margin:12px 0 4px;font-size:14px">Sources <span class="ads-muted" data-k="sources-host"></span></h3>
      <div class="ads-table-wrap">
      <table class="ads-table" style="width:100%;border-collapse:collapse">
        <thead><tr><th>URL</th><th>Tier</th><th>Status</th><th>Last fetched</th><th>Bytes</th><th>Block reason</th></tr></thead>
        <tbody data-k="sources-rows"><tr><td colspan="6" class="ads-muted">Loading…</td></tr></tbody>
      </table>
      </div>
    </section>
  </div>
</template>

<div id="ads-firm-edit-modal" class="ads-modal" hidden style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center">
  <form id="ads-firm-edit-form" class="ads-modal-form" style="background:var(--ads-panel);border:1px solid var(--ads-border);border-radius:8px;width:min(540px,94vw);max-height:84vh;overflow:auto;padding:16px">
    <h3 style="grid-column:span 2;margin:0 0 4px">Edit firm</h3>
    <label class="ads-field" style="grid-column:span 2"><span>Name</span><input name="name"></label>
    <label class="ads-field"><span>Kind</span>
      <select name="kind"><option value="">—</option><option>vc</option><option>pe</option><option>family_office</option><option>corp_vc</option><option>angel_group</option><option>accelerator</option><option>gov_fund</option></select>
    </label>
    <label class="ads-field"><span>Lead/co</span><select name="lead_or_co"><option value="">—</option><option>lead</option><option>co</option></select></label>
    <label class="ads-field" style="grid-column:span 2"><span>Website</span><input name="website" type="url"></label>
    <label class="ads-field"><span>HQ city</span><input name="hq_city"></label>
    <label class="ads-field"><span>HQ country (ISO2)</span><input name="hq_country_iso2" maxlength="2"></label>
    <label class="ads-field"><span>Founded year</span><input name="founded_year" type="number"></label>
    <label class="ads-field"><span>AUM USD</span><input name="aum_usd" type="number"></label>
    <label class="ads-field"><span>Check size typ. USD</span><input name="check_size_typical_usd" type="number"></label>
    <label class="ads-field"><span>Contact email</span><input name="contact_email" type="email"></label>
    <label class="ads-field" style="grid-column:span 2"><span>Thesis</span><textarea name="thesis" rows="3"></textarea></label>
    <div style="grid-column:span 2;display:flex;gap:6px;justify-content:flex-end;margin-top:8px">
      <button type="button" class="ads-btn ads-btn--ghost" data-act="edit-cancel">Cancel</button>
      <button type="submit" class="ads-btn">Save</button>
    </div>
  </form>
</div>

<script src="/assets/js/relationship-graph.js?v={{ site.time | date: '%s' }}"></script>

<script>
  // Task #2: lazy-mount the News tab against the firm's u_entities id once
  // the user opens the tab. Resolves via /api/entities/resolve?table=firms.
  document.addEventListener("DOMContentLoaded", function () {
    var mounted = false;
    document.querySelectorAll('#ads-firm-tabs .ads-tab').forEach(function (t) {
      t.addEventListener("click", async function () {
        if (mounted || t.getAttribute("data-tab") !== "news") return;
        mounted = true;
        var ref = new URLSearchParams(window.location.search).get("id");
        if (!ref || !window.ADS || !window.ADS.News) return;
        try {
          var API = (window.ADS_API_BASE).replace(/\/+$/, "");
          var r = await window.adsUtil.request(API + "/api/entities/resolve?table=firms&ref=" + encodeURIComponent(ref), { credentials: "include" });
          var j = r.ok ? await r.json() : null;
          if (!j || !j.entity_id) {
            document.getElementById("ads-news-timeline").innerHTML = '<div class="ads-muted">No unified entity mapped for this firm yet.</div>';
            return;
          }
          var pane = document.querySelector('[data-pane="news"]');
          pane.id = pane.id || "ads-firm-news-pane";
          window.ADS.News.mount({ rootId: pane.id, entityId: j.entity_id, minRep: 0.7 });
        } catch (e) {
          document.getElementById("ads-news-timeline").innerHTML = '<div class="ads-muted">News unavailable: ' + e.message + '</div>';
        }
      });
    });
  });
</script>
