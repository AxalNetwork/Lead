---
layout: default
title: Companies
permalink: /dashboard/companies/
---

<h1 class="ads-page-title">Companies</h1>
<p class="ads-page-sub">Portfolio companies, rounds, exits.</p>

<div class="ads-card">
  <div class="ads-strip" id="ads-companies-strip"><div class="ads-loading">Loading…</div></div>
</div>

<div class="ads-card" style="margin-top:16px">
  <form id="ads-companies-filters" class="ads-filter-grid ads-filter-grid--6" autocomplete="off">
    <label class="ads-field"><span>Search</span><input name="q" placeholder="name or domain"></label>
    <label class="ads-field"><span>Status</span>
      <select name="status">
        <option value="">all</option>
        <option value="active">active</option>
        <option value="acquired">acquired</option>
        <option value="ipo">ipo</option>
        <option value="shutdown">shutdown</option>
        <option value="stealth">stealth</option>
      </select>
    </label>
    <label class="ads-field"><span>Stage</span><input name="stage" placeholder="seed, series_a…"></label>
    <label class="ads-field"><span>Sector</span><input name="sector" placeholder="ai, fintech…"></label>
    <label class="ads-field"><span>Country (ISO2)</span><input name="country" maxlength="2" style="text-transform:uppercase"></label>
    <label class="ads-field" style="display:flex;align-items:center;gap:6px"><span><input type="checkbox" name="unicorn" value="1"> Unicorn only</span></label>
    <div style="grid-column:1/-1;display:flex;gap:8px">
      <button class="ads-btn" type="submit">Apply</button>
      <button class="ads-btn ads-btn--ghost" type="reset">Reset</button>
      <span class="ads-form-msg" id="ads-companies-msg"></span>
    </div>
  </form>
</div>

<div class="ads-card" style="margin-top:16px">
  <div id="ads-companies-list"><div class="ads-loading">Loading…</div></div>
  <div style="margin-top:12px;text-align:center">
    <button class="ads-btn ads-btn--ghost" id="ads-companies-more" hidden>Load more</button>
  </div>
</div>

<script src="/assets/js/bulk-bar.js?v={{ site.time | date: '%s' }}"></script>
<script src="/assets/js/companies.js?v={{ site.time | date: '%s' }}"></script>
