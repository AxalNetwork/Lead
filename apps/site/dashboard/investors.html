<h1 class="ads-page-title">Investors</h1>
<p class="ads-page-sub">Browse the investor universe — GPs, angels, scouts, operators, LPs.</p>

<div class="ads-card">
  <div class="ads-strip" id="ads-investors-strip"><div class="ads-loading">Loading…</div></div>
</div>

<div class="ads-card" style="margin-top:16px">
  <form id="ads-investors-filters" class="ads-filter-grid ads-filter-grid--6" autocomplete="off">
    <label class="ads-field"><span>Search</span><input name="q" placeholder="name or org"></label>
    <label class="ads-field"><span>Kind</span>
      <select name="kind">
        <option value="">all</option>
        <option value="gp">GP</option><option value="angel">Angel</option>
        <option value="operator">Operator</option><option value="lp">LP</option>
        <option value="scout">Scout</option><option value="principal">Principal</option>
        <option value="associate">Associate</option>
      </select>
    </label>
    <label class="ads-field"><span>Stage</span><input name="stage" placeholder="seed, series_a…"></label>
    <label class="ads-field"><span>Sector</span><input name="sector" placeholder="ai, fintech…"></label>
    <label class="ads-field"><span>Country (ISO2)</span><input name="country" maxlength="2" style="text-transform:uppercase"></label>
    <label class="ads-field"><span>Min check ($)</span><input name="min_check_usd" type="number" min="0"></label>
    <div style="grid-column:1/-1;display:flex;gap:8px">
      <button class="ads-btn" type="submit">Apply</button>
      <button class="ads-btn ads-btn--ghost" type="reset">Reset</button>
      <span class="ads-form-msg" id="ads-investors-msg"></span>
    </div>
  </form>
</div>

<div class="ads-card" style="margin-top:16px">
  <div id="ads-investors-list"><div class="ads-loading">Loading…</div></div>
  <div style="margin-top:12px;text-align:center">
    <button class="ads-btn ads-btn--ghost" id="ads-investors-more" hidden>Load more</button>
  </div>
</div>

<script src="/assets/js/bulk-bar.js?v={{ site.time | date: '%s' }}"></script>
<script src="/assets/js/investors.js?v={{ site.time | date: '%s' }}"></script>
<script src="/assets/js/field-edit.js?v={{ site.time | date: '%s' }}"></script>
