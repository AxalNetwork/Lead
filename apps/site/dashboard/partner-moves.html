---
layout: default
title: Partner moves
permalink: /dashboard/partner-moves/
---
<section class="ads-section">
  <h1 class="ads-h1">Partner moves</h1>
  <p class="ads-sub">Sankey of partner flows between firms (default trailing 6 months).</p>
  {% include charts/dashboard_shell.html %}

  <div id="dashboard-content" hidden>
    <div class="ads-card">
      <form id="filter-form" style="display:flex;gap:.5rem;flex-wrap:wrap">
        <select class="ads-input" name="months_back">
          <option value="3">last 3 months</option>
          <option value="6" selected>last 6 months</option>
          <option value="12">last 12 months</option>
          <option value="24">last 24 months</option>
        </select>
        <input class="ads-input" name="firm" placeholder="firm entity id">
        <button class="ads-btn" type="submit">Apply</button>
        <span style="flex:1"></span>
        <button class="ads-btn" id="export-csv" type="button">Export CSV</button>
      </form>
    </div>
    <div class="ads-card" style="margin-top:1rem"><div id="sankey">Loading…</div></div>
    <div class="ads-card" style="margin-top:1rem">
      <h3>Recent moves</h3>
      <div class="ads-table-wrap">
        <table class="ads-table">
          <thead><tr><th>Date</th><th>Person</th><th>Type</th><th>From</th><th>To</th><th>Title</th></tr></thead>
          <tbody id="moves-tbody"><tr><td colspan="6">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</section>

<script src="/assets/js/dashboards.js"></script>
<script>
(async function(){
  var ok = await adsDashboards.gate("partner-moves"); if(!ok) return;
  var d = adsDashboards; var current = {};
  function readFilters(){ var fd = new FormData(document.getElementById("filter-form")); var o={}; fd.forEach(function(v,k){if(v)o[k]=v;}); return o; }
  async function load(){
    current = readFilters();
    try {
      var r = await d.api("/partner-moves" + d.qs(current));
      d.charts.sankey(document.getElementById("sankey"), r.links||[], {});
      var rows = (r.items||[]).slice(0,50).map(function(m){
        return '<tr><td>'+d.esc(m.observed_at)+'</td><td>'+d.esc(m.person_name_raw)+'</td><td>'+d.esc(m.movement_type)
          +'</td><td>'+d.esc(m.from_firm_entity_id||"")+'</td><td>'+d.esc(m.to_firm_entity_id||"")+'</td><td>'+d.esc(m.to_title||"")+'</td></tr>';
      }).join("") || '<tr><td colspan="6">No movements.</td></tr>';
      document.getElementById("moves-tbody").innerHTML = rows;
    } catch(e){ console.warn(e); }
  }
  document.getElementById("filter-form").addEventListener("submit", function(e){ e.preventDefault(); load(); });
  document.getElementById("export-csv").addEventListener("click", function(){ d.csv("/partner-moves","partner-moves", current); });
  load();
})();
</script>
