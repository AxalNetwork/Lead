---
layout: default
title: Sector momentum
permalink: /dashboard/sector-momentum/
---
<section class="ads-section">
  <h1 class="ads-h1">Sector momentum</h1>
  <p class="ads-sub">Heatmap of (sector × month) — deal count or total $.</p>
  {% include charts/dashboard_shell.html %}

  <div id="dashboard-content" hidden>
    <div class="ads-card">
      <form id="filter-form" style="display:flex;gap:.5rem;flex-wrap:wrap">
        <select class="ads-input" name="months_back">
          <option value="6">last 6 months</option>
          <option value="12" selected>last 12 months</option>
          <option value="24">last 24 months</option>
        </select>
        <select class="ads-input" name="metric">
          <option value="deal_count">deal count</option>
          <option value="total_usd">total $</option>
        </select>
        <button class="ads-btn" type="submit">Apply</button>
        <span style="flex:1"></span>
        <button class="ads-btn" id="export-csv" type="button">Export CSV</button>
      </form>
    </div>
    <div class="ads-card" style="margin-top:1rem"><div id="heatmap">Loading…</div></div>
  </div>
</section>

<script src="/assets/js/dashboards.js"></script>
<script>
(async function(){
  var ok = await adsDashboards.gate("sector-momentum"); if(!ok) return;
  var d = adsDashboards; var current = {months_back:"12", metric:"deal_count"};
  async function load(){
    var fd = new FormData(document.getElementById("filter-form")); current={}; fd.forEach(function(v,k){if(v)current[k]=v;});
    try {
      var r = await d.api("/sector-momentum" + d.qs({months_back: current.months_back}));
      d.charts.heatmap(document.getElementById("heatmap"), r.items||[], {metric: current.metric});
    } catch(e){ console.warn(e); }
  }
  document.getElementById("filter-form").addEventListener("submit", function(e){ e.preventDefault(); load(); });
  document.getElementById("export-csv").addEventListener("click", function(){ d.csv("/sector-momentum","sector-momentum", {months_back: current.months_back}); });
  load();
})();
</script>
