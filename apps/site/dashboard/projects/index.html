---
layout: default
title: Projects
permalink: /dashboard/projects/
---

<div class="ads-page-header" style="display:flex;align-items:center;justify-content:space-between;gap:16px">
  <div>
    <h1 class="ads-page-title">Projects</h1>
    <p class="ads-page-sub">Each project finds customers, investors, partners, hires, and design partners.</p>
  </div>
  <a class="ads-btn" href="/dashboard/projects/new/">+ New project</a>
</div>

<div id="ads-projects-list" class="ads-card" style="margin-top:12px">
  <div class="ads-muted">Loading projects…</div>
</div>

<script>
(async function () {
  const list = document.getElementById('ads-projects-list');
  try {
    const r = await fetch('https://api.aidatasignal.com/api/projects', { credentials: 'include' });
    if (!r.ok) throw new Error('http ' + r.status);
    const { projects } = await r.json();
    if (!projects.length) {
      list.innerHTML = '<div class="ads-muted">No projects yet. Click <b>+ New project</b> to get started.</div>';
      return;
    }
    const fmt = (n) => Number(n || 0).toLocaleString();
    list.innerHTML = projects.map((p) => `
      <a href="/dashboard/projects/workspace/?id=${encodeURIComponent(p.id)}" class="ads-project-card" style="display:block;padding:14px;border-bottom:1px solid #eef1f6;color:inherit;text-decoration:none">
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline">
          <div>
            <div style="font-weight:600">${p.name}</div>
            <div class="ads-muted" style="font-size:12px">${p.one_liner || ''}</div>
          </div>
          <div style="display:flex;gap:8px;font-size:12px;flex-wrap:wrap;justify-content:flex-end">
            <span class="ads-chip">Customers ${fmt(p.match_count_customer)}</span>
            <span class="ads-chip">Investors ${fmt(p.match_count_investor)}</span>
            <span class="ads-chip">Partners ${fmt(p.match_count_partner)}</span>
            <span class="ads-chip">Hires ${fmt(p.match_count_hire)}</span>
            <span class="ads-chip">Design ${fmt(p.match_count_design_partner)}</span>
          </div>
        </div>
      </a>
    `).join('');
  } catch (e) {
    list.innerHTML = '<div class="ads-muted">Failed to load projects: ' + e.message + '</div>';
  }
})();
</script>

<style>
  .ads-chip { display:inline-block; padding:2px 8px; border-radius:999px; background:#eef1f6; font-size:12px; color:#37414f }
  .ads-project-card:hover { background:#f8fafc }
</style>
