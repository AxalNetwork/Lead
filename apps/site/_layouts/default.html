<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <link rel="icon" type="image/webp" href="/assets/images/favicon.webp">
  <link rel="preconnect" href="{{ site.api_base }}" crossorigin>
  <link rel="dns-prefetch" href="{{ site.api_base }}">
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/plugins.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/design.css?v={{ site.time | date: '%s' }}">
  <link rel="stylesheet" href="/assets/css/dashboard.css?v={{ site.time | date: '%s' }}">
  <script>
    // Apply persisted theme synchronously to avoid FOUC.
    (function () {
      try {
        var t = localStorage.getItem("ads.theme") || "auto";
        var resolved = t;
        if (t === "auto") resolved = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", resolved);
        var r = localStorage.getItem("ads.rail") || "expanded";
        document.documentElement.setAttribute("data-rail-pre", r);
      } catch (e) {}
    })();
  </script>
</head>
<body class="ads-body">
  <div class="ads-shell" id="ads-shell" data-rail="expanded">
    {% include shell/sidenav.html %}
    <div class="ads-shell__main">
      {% include shell/topbar.html %}
      <main class="ads-main" id="ads-main" tabindex="-1">
        {{ content }}
      </main>
    </div>
  </div>
  <script>
    (function () {
      var pre = document.documentElement.getAttribute("data-rail-pre");
      var s = document.getElementById("ads-shell");
      if (s && pre) s.setAttribute("data-rail", pre);
    })();
    window.ADS = window.ADS || {};
    window.ADS.API = "{{ site.api_base }}";
  </script>
  <script src="/assets/js/jquery.min.js" defer></script>
  <script src="/assets/js/ui.js?v={{ site.time | date: '%s' }}" defer></script>
  <script src="/assets/js/cmdk.js?v={{ site.time | date: '%s' }}" defer></script>
  <script src="/assets/js/dashboard.js?v={{ site.time | date: '%s' }}" defer></script>
  <script src="/assets/js/alerts-bell.js?v={{ site.time | date: '%s' }}" defer></script>
  <script src="/assets/js/watch-star.js?v={{ site.time | date: '%s' }}" defer></script>
  <script src="/assets/js/charts.js" defer></script>
  <script src="/assets/js/dashboard_charts.js" defer></script>
  <script src="/assets/js/analytics.js" defer></script>
  {% if site.cf_web_analytics_token != "" %}
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js"
    data-cf-beacon='{"token":"{{ site.cf_web_analytics_token }}"}'></script>
  {% endif %}
</body>
</html>
