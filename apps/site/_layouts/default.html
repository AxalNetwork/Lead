<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <link rel="icon" type="image/webp" href="/assets/images/favicon.webp">
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/plugins.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
</head>
<body class="ads-body">
  <header class="ads-topbar">
    <div class="ads-topbar__inner">
      <a href="/dashboard/" class="ads-brand">AI Data Signal</a>
      <nav class="ads-nav">
        <a href="/dashboard/" class="{% if page.url == '/dashboard/' %}active{% endif %}">Dashboard</a>
        <a href="/dashboard/jobs/" class="{% if page.url == '/dashboard/jobs/' %}active{% endif %}">Jobs</a>
        <a href="/dashboard/review/" class="{% if page.url == '/dashboard/review/' %}active{% endif %}">Review</a>
        <a href="/dashboard/firms/" class="{% if page.url == '/dashboard/firms/' %}active{% endif %}">Firms</a>
        <a href="/dashboard/investors/" class="{% if page.url contains '/dashboard/investors' %}active{% endif %}">Investors</a>
        <a href="/dashboard/companies/" class="{% if page.url contains '/dashboard/companies' %}active{% endif %}">Companies</a>
        <a href="/dashboard/analytics/" class="{% if page.url == '/dashboard/analytics/' %}active{% endif %}">Analytics</a>
        <a href="/dashboard/analytics-firms/" class="{% if page.url == '/dashboard/analytics-firms/' %}active{% endif %}">Firm Analytics</a>
        <a href="/dashboard/segments/" class="{% if page.url == '/dashboard/segments/' %}active{% endif %}">Segments</a>
        <a href="/dashboard/icps/" class="{% if page.url == '/dashboard/icps/' %}active{% endif %}">ICPs</a>
        <a href="/dashboard/campaigns/" class="{% if page.url == '/dashboard/campaigns/' %}active{% endif %}">Campaigns</a>
        <a href="/dashboard/compliance/" class="{% if page.url == '/dashboard/compliance/' %}active{% endif %}">Compliance</a>
        <a href="/">Home</a>
      </nav>
      <div class="ads-user">
        <span id="ads-user-email" class="ads-user__email">…</span>
        <a href="https://axalnetwork.cloudflareaccess.com/cdn-cgi/access/logout" class="ads-user__logout">Sign out</a>
      </div>
    </div>
  </header>
  <main class="ads-main">
    {{ content }}
  </main>
  <script src="/assets/js/jquery.min.js"></script>
  <script src="/assets/js/dashboard.js"></script>
  <script src="/assets/js/charts.js"></script>
  <script src="/assets/js/dashboard_charts.js"></script>
  <script src="/assets/js/analytics.js"></script>
  {% if site.cf_web_analytics_token != "" %}
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js"
    data-cf-beacon='{"token":"{{ site.cf_web_analytics_token }}"}'></script>
  {% endif %}
</body>
</html>
