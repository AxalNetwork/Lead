<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="icon" type="image/webp" href="/assets/images/favicon.webp">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
       background:#0b0d12;color:#e7eaf0;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:#7aa2ff;text-decoration:none}
  a:hover{color:#a8c0ff}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px}
  header{padding:28px 0;display:flex;align-items:center;justify-content:space-between}
  .brand{display:inline-flex;align-items:center;gap:14px;line-height:1;text-decoration:none}
  .brand img{display:block;height:56px;width:auto}
  .brand-text{font-size:24px;font-weight:700;color:#fff;letter-spacing:-.3px;white-space:nowrap}
  .btn{display:inline-block;padding:10px 18px;border-radius:8px;font-weight:600;font-size:14px;
       background:#7aa2ff;color:#0b0d12;border:1px solid #7aa2ff;transition:all .15s}
  .btn:hover{background:#a8c0ff;border-color:#a8c0ff;color:#0b0d12}
  .btn.ghost{background:transparent;color:#e7eaf0;border-color:#2a2f3a}
  .btn.ghost:hover{border-color:#7aa2ff;color:#fff}
  .hero{padding:80px 0 64px;text-align:center}
  .hero h1{font-size:clamp(34px,5vw,56px);line-height:1.1;font-weight:700;color:#fff;letter-spacing:-.5px;margin-bottom:20px}
  .hero p{font-size:clamp(16px,1.6vw,20px);color:#9aa3b2;max-width:640px;margin:0 auto 32px}
  .cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .features{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;padding:32px 0 80px}
  .card{background:#11141b;border:1px solid #1d212c;border-radius:12px;padding:24px}
  .card h3{font-size:16px;color:#fff;margin-bottom:8px}
  .card p{font-size:14px;color:#9aa3b2}
  footer{padding:32px 0;border-top:1px solid #1d212c;color:#6b7280;font-size:13px;
         display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  @media (max-width:768px){
    html,body{max-width:100vw;overflow-x:hidden}
    .wrap{padding:0 16px}
    header{padding:18px 0;gap:8px}
    .brand{gap:10px}
    .brand img{height:40px}
    .brand-text{font-size:18px}
    .btn{padding:12px 18px;font-size:14px;min-height:44px}
    .hero{padding:48px 0 36px}
    .hero h1{font-size:30px;line-height:1.15;letter-spacing:-.3px}
    .hero p{font-size:15px;margin-bottom:24px}
    .cta{flex-direction:column;align-items:stretch}
    .cta .btn{width:100%;text-align:center}
    .features{grid-template-columns:1fr;padding:24px 0 60px;gap:14px}
    .card{padding:18px}
    footer{flex-direction:column;align-items:flex-start;gap:6px;font-size:12px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="/" aria-label="AI Data Signal home">
      <img src="/assets/images/aidatasignal-logo.png" alt="" aria-hidden="true">
      <span class="brand-text">AI Data Signal</span>
    </a>
    <a class="btn ghost" href="/dashboard/">Sign in</a>
  </header>

  {{ content }}

  <footer>
    <div>&copy; {{ 'now' | date: '%Y' }} AI Data Signal</div>
    <div>Single-operator lead intelligence</div>
  </footer>
</div>
</body>
</html>
