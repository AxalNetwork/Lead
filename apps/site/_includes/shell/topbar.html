<header class="ads-topbar">
  <button type="button" id="ads-rail-toggle" class="ads-rail-toggle" aria-label="Toggle navigation"
          aria-controls="ads-rail" aria-expanded="true">
    <span aria-hidden="true">☰</span>
  </button>
  <div class="ads-topbar__title">{{ page.title | default: "Dashboard" }}</div>
  <div class="ads-topbar__spacer"></div>

  <button type="button" id="ads-cmdk-trigger" class="ads-topbar__btn" aria-label="Open command palette"
          aria-keyshortcuts="Control+K Meta+K">
    <span aria-hidden="true">🔍</span>
    <span>Search</span>
    <span class="ads-kbd" aria-hidden="true">⌘K</span>
  </button>

  <button type="button" id="ads-theme-toggle" class="ads-topbar__btn" aria-label="Toggle color theme">
    <span id="ads-theme-icon" aria-hidden="true">◐</span>
  </button>

  <div class="ads-notify" style="position:relative;display:inline-block;">
    <button type="button" id="ads-notify-btn" class="ads-topbar__btn" aria-label="Notifications"
            aria-haspopup="true" aria-expanded="false">
      <span aria-hidden="true">🔔</span>
      <span id="ads-notify-badge" class="ads-notify-badge" hidden></span>
    </button>
    <div id="ads-notify-dropdown" class="ads-notify-dropdown" role="dialog" aria-label="Recent alerts" hidden>
      <div class="ads-notify-dropdown__head">
        <strong>Alerts</strong>
        <button type="button" id="ads-notify-readall" class="ads-link">Mark all read</button>
      </div>
      <ul id="ads-notify-list" class="ads-notify-list" aria-busy="true"></ul>
      <div class="ads-notify-dropdown__foot">
        <a href="/dashboard/alerts/" class="ads-link">View all alerts →</a>
      </div>
    </div>
  </div>

  <a href="https://{{ site.team_domain }}/cdn-cgi/access/logout"
     class="ads-avatar" id="ads-user-avatar"
     aria-label="Sign out" title="Sign out"
     data-user-email="">·</a>
</header>
