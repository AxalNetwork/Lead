# Repo-root wrangler.toml — SHIM ONLY.
#
# The real Worker config is the single source of truth at
# apps/worker/wrangler.toml and is deployed by GitHub Actions
# (.github/workflows/deploy-worker.yml) which runs
# `wrangler deploy` from the apps/worker/ directory.
#
# This file exists ONLY to satisfy Cloudflare's hosted "Workers Builds"
# pipeline, which clones the repo, runs `npx wrangler deploy` from the
# repo root (not configurable without dashboard access), and otherwise
# falls back to framework auto-detection — it sees `hono` in the root
# package.json and bails with: 'The detected framework ("Hono") cannot
# be automatically configured.'
#
# To avoid colliding with the real `lead` Worker, this shim deploys a
# tiny no-op Worker under a separate name. The real Worker bundle and
# all 27 bindings stay in apps/worker/wrangler.toml.
name = "aidatasignal-cf-builds-shim"
main = "cf-builds-shim.js"
compatibility_date = "2025-01-15"
