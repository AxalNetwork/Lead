# Root-level wrangler config so Cloudflare Workers Builds can run
# `npx wrangler deploy` directly from the repo root. The actual worker source
# lives in apps/worker/; this file just re-points `main` and re-declares the
# bindings. Keep this in sync with apps/worker/wrangler.toml.

name = "lead"
main = "apps/worker/src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]
account_id = "30c9362191318777b71647145decda48"

workers_dev = false

# Browser Rendering binding for the fetcher tier-1 fallback. Declared at the
# top of the file so TOML doesn't accidentally nest it under the previous
# table block.
browser = { binding = "BROWSER" }

[vars]
ALLOWED_EMAIL = "guillaumelauzier@gmail.com"
ACCESS_TEAM_DOMAIN = "axalnetwork.cloudflareaccess.com"
ACCESS_AUD = "f9cbce05165afb5af93e5929ff93dc4591aa18cd8234244327e78fd29fa849dd"
ACCESS_APP_AUD = "3677234625cd7a8a9065c46ec41ab908bb7a24cfbc0c20169477305327cb3e79"

[[d1_databases]]
binding = "DB"
database_name = "aidatasignal-leads"
database_id = "ecd7272e-533d-4e01-81ba-e1b98bce6e1c"

[[kv_namespaces]]
binding = "SESSIONS"
id = "302eb1a32ae64ce588dee452e14b3217"

[[kv_namespaces]]
binding = "SCRAPE_CACHE"
id = "302eb1a32ae64ce588dee452e14b3217"

[[r2_buckets]]
binding = "RAW_HTML"
bucket_name = "aidatasignal-raw-html"

[[queues.producers]]
binding = "LEAD_QUEUE"
queue = "aidatasignal-lead-jobs"

[[queues.consumers]]
queue = "aidatasignal-lead-jobs"
max_batch_size = 10
max_batch_timeout = 5

[[routes]]
pattern = "api.aidatasignal.com"
custom_domain = true

[triggers]
crons = ["0 */6 * * *"]
